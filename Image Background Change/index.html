<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Background Change</title>
    <link rel="shortcut icon" href="https://img.icons8.com/fluency-systems-filled/50/FFFFFF/image-document.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="img-box">
            <img src="assets/transparent.png" width="100%">

            <div class="img-wrap">
                <img src="assets/original.jpg" id="original-img">
            </div>
            <span id="line"><img src="assets/arrow.png" alt="" class="arrow"></span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
