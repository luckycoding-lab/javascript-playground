<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Calendar</title>
    <link rel="shortcut icon" href="https://img.icons8.com/material/24/FFFFFF/calendar--v1.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hero">
        <div class="calendar">
            <div class="left">
                <p id="date">01</p>
                <p id="day">Wednesday</p>
            </div>
            <div class="right">
                <p id="month">September</p>
                <p id="year">2024</p>
            </div>
        </div>
        <div class="container">
            <p id="timer"></p>
          </div>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
