<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/1087/1087815.png" type="image/x-icon">
   <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap');
        body {
            font-family: "Roboto", sans-serif;
            background: #070505e3;
            height: 100vh;
            color: white;
            display: flex;
            flex-direction: row;
            text-align: center;
            
            justify-content: center;
            align-items: center;
        }
        .container-counter {
            /* margin: 10px;
            padding: 10px; */
            width: 300px;
            font-size: 32px;
        }
        .container-counter .counter {
            color: #ec6eadae;
        }
        .container-counter span {
            color: #f2f2f2;
            font-weight: bold;
        }
        i {
            font-size: 80px;
            color: #3493e6b9;
        }
    </style>
</head>
<body>
    <div class="container-counter">
        <i class="bi bi-cup-hot-fill"></i>
        <div class="counter" data-target="4000">
        </div>
            <span>Project Completed</span>
    </div>
    <div class="container-counter">
        <i class="bi bi-person-hearts"></i>
        <div class="counter" data-target="15000">
        </div>
            <span>Our Happy Clients</span>
    </div>
    <div class="container-counter">
        <i class="bi bi-server"></i>
        <div class="counter" data-target="500"></div>
            <span>On Going Projects</span>
    </div>
   <script>
    const counters = document.querySelectorAll('.counter');

    counters.forEach ((counter) => {
        counter.innerHTML = 0;

        const updateCounter = () => {
            const targetCount = +counter.getAttribute('data-target');

            const startingCount = Number(counter.innerHTML);
            const incr = targetCount/ 100;

            if(startingCount < targetCount) {
                counter.innerHTML = `${Math.round(startingCount + incr)}`;
                setTimeout(updateCounter, 10);
            }else {
                counter.innerHTML = targetCount;
            }
        }
        updateCounter();
    })
   </script>
</body>
</html>
