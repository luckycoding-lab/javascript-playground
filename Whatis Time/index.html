<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock Time</title>
    <link rel="shortcut icon" href="https://icon-library.com/images/clock-icon-white/clock-icon-white-22.jpg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero">
        <div class="container">
            <div class="clock">
                <span id="hrs">00</span>
                <span>:</span>
                <span id="min">00</span>
                <span>:</span>
                <span id="sec">00</span>
                <span>:</span>
                <span id="minsec">00</span>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
