<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Menu Design - JS</title>
    <link rel="shortcut icon" href="https://img.icons8.com/fluency/48/FFFFFF/dribbble.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero">
        <div class="selector">
            <div id="selectField">
                <p id="selectText">Select Social Media</p> &nbsp;
                <img id="arrow-icon" src="https://img.icons8.com/android/24/expand-arrow.png">
            </div>
            <ul id="list" class="hide">
                <li class="options">
                    <img src="https://img.icons8.com/tiny-glyph/32/facebook-new.png" alt="">
                    <p>Facebook</p>
                </li>
                <li class="options">
                    <img src="https://img.icons8.com/tiny-glyph/32/instagram-new.png" alt="">
                    <p>Instagram</p>
                </li>
                <li class="options">
                    <img src="https://img.icons8.com/tiny-glyph/32/pinterest.png" alt="">
                    <p>Pinterest</p>
                </li>
                <li class="options">
                    <img src="https://img.icons8.com/tiny-glyph/32/reddit.png" alt="">
                    <p>Reddit</p>
                </li>
                <li class="options">
                    <img src="https://img.icons8.com/tiny-glyph/32/--tinder.png" alt="">
                    <p>Tinder</p>
                </li>
            </ul>
        </div>

    </div>





    <script src="script.js"></script>
</body>
</html>
